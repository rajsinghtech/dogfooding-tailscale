name: Renovate PR Compatibility Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**/*.tf'

env:
  # renovate: datasource=github-releases depName=hashicorp/terraform
  TF_VERSION: '1.16.6'

jobs:
  check-renovate-pr:
    name: Check if Renovate PR
    runs-on: ubuntu-latest
    outputs:
      is_renovate: ${{ steps.check.outputs.is_renovate }}
    steps:
      - name: Check PR author
        id: check
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$PR_AUTHOR" = "renovate[bot]" ] || [ "$PR_AUTHOR" = "renovate" ]; then
            echo "is_renovate=true" >> "$GITHUB_OUTPUT"
            echo "This is a Renovate PR"
          else
            echo "is_renovate=false" >> "$GITHUB_OUTPUT"
            echo "This is not a Renovate PR"
          fi

  full-init-test:
    name: Full Init Test - All Components
    runs-on: ubuntu-latest
    needs: check-renovate-pr
    if: needs.check-renovate-pr.outputs.is_renovate == 'true'
    outputs:
      results: ${{ steps.test.outputs.results }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Test All Components
        id: test
        run: |
          RESULTS=""
          FAILED=0

          for dir in terraform/components/terraform/*/; do
            COMPONENT=$(basename "$dir")

            # Skip modules directory
            if [ "$COMPONENT" = "modules" ]; then
              continue
            fi

            echo "Testing: $COMPONENT"

            # Same lock check as Terraform Validation. A stale .terraform.lock.hcl must fail the PR.
            if terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly > /tmp/init.log 2>&1; then
              RESULTS="$RESULTS\n| $COMPONENT | :white_check_mark: Pass |"
              echo "  - Init: Success"
            else
              RESULTS="$RESULTS\n| $COMPONENT | :x: Failed |"
              echo "  - Init: Failed"
              cat /tmp/init.log
              FAILED=$((FAILED + 1))
            fi
          done

          # Save results for comment
          {
            echo "results<<EOF"
            echo -e "$RESULTS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED component(s) failed init -lockfile=readonly"
            exit 1
          fi

      - name: Generate Provider Report
        id: providers
        run: |
          {
            echo "## Provider Versions in This PR"
            echo ""
            echo "| Provider | Version Constraint | Source |"
            echo "|----------|-------------------|--------|"

            # Find all provider version constraints.
            grep -rh "version\s*=" terraform/components/terraform/*/versions.tf 2>/dev/null |
              grep -v "required_version" |
              sort -u | while read -r line; do
                echo "| - | $line | versions.tf |"
              done
          } > /tmp/provider-report.md

          cat /tmp/provider-report.md >> "$GITHUB_STEP_SUMMARY"

  post-comment:
    name: Post PR Comment
    runs-on: ubuntu-latest
    needs: [check-renovate-pr, full-init-test]
    if: needs.check-renovate-pr.outputs.is_renovate == 'true'
    permissions:
      pull-requests: write
    steps:
      - name: Post Compatibility Report
        uses: actions/github-script@v9
        with:
          script: |
            const results = `${{ needs.full-init-test.outputs.results }}`;

            const body = `## Terraform Provider Compatibility Report

            This PR was created by Renovate to update Terraform provider versions.

            ### Component Init Test Results

            | Component | Status |
            |-----------|--------|
            ${results}

            ### What was tested
            - \`terraform init -backend=false -lockfile=readonly\` on all components
            - A stale or missing lock-file hash fails this check

            Terraform Validation (fmt, validate, tflint) and KWOK Flux also run on these PRs. KWOK reconciles the Flux tree, so a chart or manifest bump is exercised there. \`terraform plan\` against a live cloud is not.
            `;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

name: Terraform Validation

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'clusters/common/bootstrap/**'
      - '.github/workflows/terraform-validate.yaml'
      - '.tflint.hcl'
      - '.checkov.yaml'
      - '.trivyignore'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'clusters/common/bootstrap/**'
      - '.github/workflows/terraform-validate.yaml'
      - '.tflint.hcl'
      - '.checkov.yaml'
      - '.trivyignore'

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=hashicorp/terraform
  TF_VERSION: '1.16.6'
  # renovate: datasource=github-releases depName=terraform-linters/tflint
  TFLINT_VERSION: 'v0.64.0'

jobs:
  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff terraform/ test/

  roots:
    name: List Terraform roots
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.list.outputs.components }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every root is validated on every run: shared modules are used by
      # several roots, so a change-based subset misses breakage.
      - name: List roots
        id: list
        run: |
          components=$(find terraform/components/terraform -mindepth 2 -maxdepth 2 -name versions.tf \
            -not -path '*/modules/*' -printf '%h\n' | xargs -n1 basename | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "components=$components" >> "$GITHUB_OUTPUT"
          echo "Roots: $components"

  # Renovate writes lock hashes itself and sometimes gets them wrong. On a
  # Renovate PR this job rewrites every lock with Terraform and commits the
  # result so init -lockfile=readonly can pass. On any other PR it only checks
  # the root modules whose versions.tf or lock file the PR changed; keeping the
  # rest current is Renovate's lockFileMaintenance job.
  locks:
    name: Refresh provider locks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.finish.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Select newest providers and write every platform hash
        id: refresh
        env:
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ "$ACTOR" = "renovate[bot]" ] || [ "$ACTOR" = "renovate" ]; then
            if ! git diff --name-only "$base"...HEAD | grep -Eq '(^|/)(versions\.tf|\.terraform\.lock\.hcl)$'; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            test/terraform/refresh-locks.sh
          else
            mapfile -t dirs < <(git diff --name-only "$base"...HEAD |
              grep -E '(^|/)(versions\.tf|\.terraform\.lock\.hcl)$' | grep -v '/modules/' |
              xargs -r -n1 dirname | sort -u | while read -r d; do [ -f "$d/versions.tf" ] && echo "$d"; done)
            if [ "${#dirs[@]}" -eq 0 ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            test/terraform/refresh-locks.sh "${dirs[@]}"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit lock updates on Renovate pull requests
        if: steps.refresh.outputs.changed == 'true'
        id: finish
        env:
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          mapfile -t locks < <(find . -name .terraform.lock.hcl)
          if git diff --quiet -- "${locks[@]}"; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ACTOR" = "renovate[bot]" ] || [ "$ACTOR" = "renovate" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u -- "${locks[@]}"
            git commit -m "Refresh Terraform provider lock files"
            git push origin "HEAD:${{ github.head_ref }}"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git diff -- "${locks[@]}"
            echo "::error::Provider lock files are stale for root modules this PR changed. Run test/terraform/refresh-locks.sh <dir> and commit the result."
            exit 1
          fi

  helm-templates:
    name: Template Terraform Helm releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Render helm_release charts
        run: test/helm/template-releases.sh

  terraform-validate:
    name: Validate - ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: [roots, locks]
    if: >-
      always() && needs.roots.result == 'success' &&
      (needs.locks.result == 'success' || needs.locks.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.roots.outputs.components) }}
    defaults:
      run:
        working-directory: terraform/components/terraform/${{ matrix.component }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.locks.outputs.sha || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # tailscale_tailnet is unreleased; validate the tailnet root against the PR build.
      - name: Setup Go
        if: matrix.component == 'tailnet'
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Build tailscale provider from PR 825
        if: matrix.component == 'tailnet'
        working-directory: .
        run: |
          make tailscale-provider-pr825
          echo "TF_CLI_CONFIG_FILE=$GITHUB_WORKSPACE/terraform/work/tailscale-pr825.tfrc" >> "$GITHUB_ENV"

      # -lockfile=readonly fails when .terraform.lock.hcl is missing or stale.
      - name: Terraform Init
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform Validate
        run: terraform validate -no-color

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint on every root and module
        run: |
          status=0
          for dir in $(find terraform/components/terraform test/kwok/terraform \( -name versions.tf -o -name main.tf \) -printf '%h\n' | sort -u); do
            echo "::group::$dir"
            tflint --chdir="$dir" --config="$GITHUB_WORKSPACE/.tflint.hcl" --format compact || status=1
            echo "::endgroup::"
          done
          exit $status

  trivy-security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'
          trivyignores: '.trivyignore'

  checkov-compliance:
    name: Checkov Compliance Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: terraform/
          config_file: .checkov.yaml
          output_format: cli
          soft_fail: true

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [terraform-fmt, terraform-validate, tflint, trivy-security, checkov-compliance, helm-templates, locks]
    if: always()
    steps:
      - name: Check Results
        env:
          FMT: ${{ needs.terraform-fmt.result }}
          VALIDATE: ${{ needs.terraform-validate.result }}
          TFLINT: ${{ needs.tflint.result }}
          HELM: ${{ needs.helm-templates.result }}
          LOCKS: ${{ needs.locks.result }}
          TRIVY: ${{ needs.trivy-security.result }}
          CHECKOV: ${{ needs.checkov-compliance.result }}
        run: |
          {
            echo "## Validation Results Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Terraform Format | $FMT |"
            echo "| Terraform Validate | $VALIDATE |"
            echo "| TFLint | $TFLINT |"
            echo "| Helm templates | $HELM |"
            echo "| Provider locks | $LOCKS |"
            echo "| Trivy Security | $TRIVY |"
            echo "| Checkov Compliance | $CHECKOV |"
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "$FMT" "$VALIDATE" "$TFLINT" "$HELM"; do
            [ "$r" = success ] || { echo "Required Terraform checks failed"; exit 1; }
          done
          # Locks only run on pull requests. A skipped run is a push to main.
          if [ "$LOCKS" != success ] && [ "$LOCKS" != skipped ]; then
            echo "Provider lock check failed"
            exit 1
          fi

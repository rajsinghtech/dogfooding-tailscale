name: Terraform Validation

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'clusters/common/bootstrap/**'
      - '.github/workflows/terraform-validate.yaml'
      - '.tflint.hcl'
      - '.checkov.yaml'
      - '.trivyignore'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'clusters/common/bootstrap/**'
      - '.github/workflows/terraform-validate.yaml'
      - '.tflint.hcl'
      - '.checkov.yaml'
      - '.trivyignore'

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=hashicorp/terraform
  TF_VERSION: '1.16.6'
  # renovate: datasource=github-releases depName=terraform-linters/tflint
  TFLINT_VERSION: 'v0.64.0'

jobs:
  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff terraform/ test/

  roots:
    name: List Terraform roots
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.list.outputs.components }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every root is validated on every run: shared modules are used by
      # several roots, so a change-based subset misses breakage.
      - name: List roots
        id: list
        run: |
          components=$(find terraform/components/terraform -mindepth 2 -maxdepth 2 -name versions.tf \
            -not -path '*/modules/*' -printf '%h\n' | xargs -n1 basename | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "components=$components" >> "$GITHUB_OUTPUT"
          echo "Roots: $components"

  terraform-validate:
    name: Validate - ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: roots
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.roots.outputs.components) }}
    defaults:
      run:
        working-directory: terraform/components/terraform/${{ matrix.component }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # -lockfile=readonly fails when .terraform.lock.hcl is missing or stale.
      - name: Terraform Init
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform Validate
        run: terraform validate -no-color

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint on every root and module
        run: |
          status=0
          for dir in $(find terraform/components/terraform test/kwok/terraform \( -name versions.tf -o -name main.tf \) -printf '%h\n' | sort -u); do
            echo "::group::$dir"
            tflint --chdir="$dir" --config="$GITHUB_WORKSPACE/.tflint.hcl" --format compact || status=1
            echo "::endgroup::"
          done
          exit $status

  trivy-security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'
          trivyignores: '.trivyignore'

  checkov-compliance:
    name: Checkov Compliance Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: terraform/
          config_file: .checkov.yaml
          output_format: cli
          soft_fail: true

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [terraform-fmt, terraform-validate, tflint, trivy-security, checkov-compliance]
    if: always()
    steps:
      - name: Check Results
        env:
          FMT: ${{ needs.terraform-fmt.result }}
          VALIDATE: ${{ needs.terraform-validate.result }}
          TFLINT: ${{ needs.tflint.result }}
          TRIVY: ${{ needs.trivy-security.result }}
          CHECKOV: ${{ needs.checkov-compliance.result }}
        run: |
          {
            echo "## Validation Results Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Terraform Format | $FMT |"
            echo "| Terraform Validate | $VALIDATE |"
            echo "| TFLint | $TFLINT |"
            echo "| Trivy Security | $TRIVY |"
            echo "| Checkov Compliance | $CHECKOV |"
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "$FMT" "$VALIDATE" "$TFLINT"; do
            [ "$r" = success ] || { echo "Required Terraform checks failed"; exit 1; }
          done

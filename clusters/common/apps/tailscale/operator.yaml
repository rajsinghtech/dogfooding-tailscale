---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-operator
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  path: ./clusters/common/apps/tailscale/operator
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: dogfooding-tailscale
  dependsOn:
    - name: tailscale-namespace
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings

---
# The OAuth client is not stored in Git: bootstrap (Terraform, or the Kind/KWOK
# Makefiles) creates the tailscale/operator-oauth Secret that this chart mounts.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: tailscale-operator
      version: "1.104.1"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    apiServerProxyConfig:
      mode: "true"
    operatorConfig:
      hostname: ${OPERATOR_HOSTNAME}
      image:
        tag: "${TS_OPERATOR_IMAGE_TAG:=}"
    proxyConfig:
      image:
        tag: "${TS_PROXY_IMAGE_TAG:=}"

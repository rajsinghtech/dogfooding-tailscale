---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: iperf
  namespace: flux-system
spec:
  interval: 30m
  path: ./clusters/cluster1/apps/iperf
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: dogfooding-tailscale
  dependsOn:
    - name: tailscale-crs

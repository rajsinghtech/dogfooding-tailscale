---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iperf-client
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iperf-client
  template:
    metadata:
      labels:
        app: iperf-client
    spec:
      containers:
      - name: iperf-client
        image: networkstatic/iperf3:latest@sha256:bc267517f534d9f7cced2669f325799a1fd7fe1d5953c2ca2c6ea1db61affa08
        # The container will stay alive and not run iperf immediately
        # so we can exec into it and run tests manually
        command:
        - "sleep"
        - "infinity"
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: cluster1-egress-proxy
spec:
  type: egress
  replicas: 3
  proxyClass: prod
---
apiVersion: v1
kind: Service
metadata:
  name: iperf-server-egress
  namespace: default
  annotations:
    # MagicDNS name of the iperf-server ingress proxy on the target tailnet.
    tailscale.com/tailnet-fqdn: "default-iperf-server.monitor-squeaker.ts.net"
    tailscale.com/proxy-group: "cluster1-egress-proxy"
  labels:
    tailscale.com/proxy-class: "prod"
spec:
  type: ExternalName
  externalName: unused
  ports:
  - port: 5201
    targetPort: 5201
    protocol: TCP
    name: iperf
# Example: scrape a subnet-router peer relay (Terraform tailscale_peer_relay_port)
# from a cluster running kube-prometheus-stack, through a Tailscale egress Service.
# Peer relays run by the operator (PeerRelay CR) are scraped automatically via
# the ProxyClass ServiceMonitor instead.
---
apiVersion: v1
kind: Service
metadata:
  namespace: monitoring
  annotations:
    # Tailscale IP of the subnet router running the peer relay.
    tailscale.com/tailnet-ip: 100.123.191.46
  name: peer-relay-1
spec:
  externalName: placeholder   # any value - will be overwritten by operator
  type: ExternalName
  ports:
    - port: 8080
      protocol: TCP
      name: web
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: scrape-peer-relay-1
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    tailscale_com_managed: "true"
    tailscale_com_metrics_target: peer-relay-1
    ts_prom_job: ts_peer_relay_monitoring_peer-relay-1
    ts_proxy_parent_name: peer-relay-kb-cluster1-aws-uw2-sr-1-1
    ts_proxy_parent_namespace: monitoring
    ts_proxy_type: peer-relay
spec:
  staticConfigs:
  - targets:
    - peer-relay-1.monitoring.svc.cluster.local:8080
    labels:
      ts_prom_job: ts_peer_relay_monitoring_peer-relay-1
        ts_proxy_parent_name: peer-relay-kb-cluster1-aws-uw2-sr-1-1
      ts_proxy_parent_namespace: monitoring
      ts_proxy_type: peer-relay
      tailscale_com_managed: "true"
      tailscale_com_metrics_target: peer-relay-1
  metricsPath: /metrics
  scrapeInterval: 5s
  relabelings:
  - targetLabel: namespace
    replacement: tailscale
  - sourceLabels: [ts_prom_job]
    targetLabel: job
  - sourceLabels: [ts_proxy_parent_name]
    targetLabel: ts_proxy_parent_name
  - sourceLabels: [ts_proxy_parent_namespace]
    targetLabel: ts_proxy_parent_namespace
  - sourceLabels: [ts_proxy_type]
    targetLabel: ts_proxy_type
